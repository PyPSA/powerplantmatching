<!doctype html>
<!--
Standalone data-change report, written by
`powerplantmatching.changes.write_report` next to its `index.md`. Python
fills the title, the table script (package_data/tables.js) and the body, the
`index.md` converted with the markdown extensions of the docs. Content tabs
of `pymdownx.tabbed` (alternate style) are radio buttons followed by their
labels and blocks, switched by the CSS below. Collapsed tables of
`pymdownx.details` are native <details> elements. Figures and the map are
iframes with relative paths, so the page works from file:// next to them.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PPM_TITLE__</title>
    <!-- Same versions as extra_javascript in mkdocs.yaml -->
    <script src="https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js"></script>
    <script src="https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js"></script>
    <style>
      :root { --accent: rgb(33, 102, 172); --line: #e0e0e0; }
      body { margin: 0; font: 15px/1.6 system-ui, sans-serif; color: #212121; background: #fff; }
      article { max-width: 1200px; margin: 0 auto; padding: 16px 24px 48px; }
      h1 { font-weight: 400; }
      h2 { margin-top: 2.5em; border-bottom: 1px solid var(--line); }
      a { color: var(--accent); }
      iframe { display: block; }
      /* Wide tables scroll on their own, like MkDocs Material */
      table { display: inline-block; max-width: 100%; overflow: auto; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
      th, td { padding: 4px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { position: sticky; top: 0; background: #fafafa; cursor: pointer; }
      th[aria-sort="ascending"]::after { content: " \25B2"; }
      th[aria-sort="descending"]::after { content: " \25BC"; }
      /* Collapsed tables below the figures (pymdownx.details) */
      details > summary { cursor: pointer; color: var(--accent); margin: 0.5em 0; }
      /* Descriptions directly below the tables, small and muted */
      .table-notes { margin-top: 0.25em; font-size: 13px; color: #616161; }
      /* Content tabs: radio inputs, then the labels, then one block per tab */
      .tabbed-set { margin: 1em 0; }
      .tabbed-set > input { position: absolute; opacity: 0; }
      .tabbed-labels { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
      .tabbed-labels > label { padding: 6px 12px; cursor: pointer; color: #616161; border-bottom: 2px solid transparent; }
      .tabbed-block { display: none; padding-top: 8px; }
      /* One rule per tab position, enough for TABS of changes.py */
      .tabbed-set > input:nth-child(1):checked ~ .tabbed-labels > label:nth-child(1),
      .tabbed-set > input:nth-child(2):checked ~ .tabbed-labels > label:nth-child(2),
      .tabbed-set > input:nth-child(3):checked ~ .tabbed-labels > label:nth-child(3),
      .tabbed-set > input:nth-child(4):checked ~ .tabbed-labels > label:nth-child(4),
      .tabbed-set > input:nth-child(5):checked ~ .tabbed-labels > label:nth-child(5),
      .tabbed-set > input:nth-child(6):checked ~ .tabbed-labels > label:nth-child(6),
      .tabbed-set > input:nth-child(7):checked ~ .tabbed-labels > label:nth-child(7),
      .tabbed-set > input:nth-child(8):checked ~ .tabbed-labels > label:nth-child(8) {
        color: var(--accent); border-bottom-color: var(--accent);
      }
      .tabbed-set > input:nth-child(1):checked ~ .tabbed-content > .tabbed-block:nth-child(1),
      .tabbed-set > input:nth-child(2):checked ~ .tabbed-content > .tabbed-block:nth-child(2),
      .tabbed-set > input:nth-child(3):checked ~ .tabbed-content > .tabbed-block:nth-child(3),
      .tabbed-set > input:nth-child(4):checked ~ .tabbed-content > .tabbed-block:nth-child(4),
      .tabbed-set > input:nth-child(5):checked ~ .tabbed-content > .tabbed-block:nth-child(5),
      .tabbed-set > input:nth-child(6):checked ~ .tabbed-content > .tabbed-block:nth-child(6),
      .tabbed-set > input:nth-child(7):checked ~ .tabbed-content > .tabbed-block:nth-child(7),
      .tabbed-set > input:nth-child(8):checked ~ .tabbed-content > .tabbed-block:nth-child(8) {
        display: block;
      }
    </style>
  </head>
  <body>
    <article>
__PPM_BODY__
    </article>
    <script>
__PPM_TABLES_JS__
    </script>
  </body>
</html>
